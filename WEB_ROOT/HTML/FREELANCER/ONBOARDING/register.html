<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Document</title>
  <style src="../../../PLUGINS/TAILWIND/tailwind.min.css"></style>
  <script src="../../../PLUGINS/TAILWIND/tailwind.js"></script>
  <script src="../../../PLUGINS/TAILWIND/tailwind-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Load notification script -->
  <script src="/WEB_ROOT/UTILITIES/FUNCTION_UTILIITIES/SHARED/NOTY/notification.js"></script>
  <style>
    @keyframes fade-up {
      0% {
        opacity: 0;
        transform: translateY(100px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes nav-down {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nav-down {
      animation: button-down 1.5s ease forwards;
    }

    .fade-up {
      animation: fade-up 1.5s ease-in-out forwards;
    }

    .picture {
      animation: fade-up 1.9s ease-in-out forwards;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen overflow-x-hidden">

            <div class="gap-x-14 lg:flex items-center hidden text-text-color font-medium">

            <button class=" block lg:hidden border-[0.5px] border-stone-300 px-3 py-1" id="menu" aria-label="Toggle menu">

        <select name="paymentMethod" id=""

        <button type="submit"

  <footer class="bg-slate-800 text-white w-screen h-40 mt-6 flex items-center justify-center">

  </footer>


  <!-- JavaScript for Mobile Menu -->
  <script>
    const menuBtn = document.getElementById('menu');
    const mobileMenu = document.getElementById('mobile-nav');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      big.classList.toggle('shadow-md');

    });
  </script>
